[package]
name = "gerbrr"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Gerber viewing at ridiculous speed. A GPU-accelerated Gerber and Excellon workspace."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu"] }
egui-wgpu = "0.36.2"
bytemuck = { version = "1.25", features = ["derive"] }
lyon = "1.0"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
geo = { version = "0.33", default-features = false }
rstar = "0.12"
png = "0.18"
smallvec = "1.16"
web-time = "1.1"
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = { version = "2.0", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
rfd = "0.17"
rayon = "1.11"
geo = "0.33"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[dev-dependencies]
pollster = "0.4"
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "throughput"
harness = false
